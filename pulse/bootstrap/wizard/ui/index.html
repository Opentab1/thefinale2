<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Setup Wizard</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0b0f17;color:#ecf0f3}
      .wrap{max-width:900px;margin:40px auto;padding:24px}
      .card{background:#101828;border:1px solid #1f2937;border-radius:12px;padding:20px}
      .row{display:flex;gap:12px;margin:8px 0}
      .btn{background:#2563eb;border:none;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}
      input,select{background:#0b1220;border:1px solid #1f2937;border-radius:8px;color:#e5e7eb;padding:10px;flex:1}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Pulse Setup Wizard</h1>
      <div class="card">
        <p>Quickly set up your venue. This is a placeholder UI.</p>
        <div class="row"><input placeholder="Venue name"><select><option>Timezone</option></select></div>
        <div class="row"><button class="btn" onclick="alert('Saved! Rebooting…')">Save & Reboot</button></div>
      </div>
    </div>
  </body>
</html>
